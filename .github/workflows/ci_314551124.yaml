name: CI-314551124

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Summary
        run: |
          echo "# CI Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY

      - name: TypeScript Typecheck
        id: typecheck
        run: |
          if npm run typecheck; then
            echo "| Typecheck | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Typecheck | Failed |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Prettier Check
        id: prettier
        run: |
          if npm run format:check; then
            echo "| Prettier | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Prettier | Failed |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run Tests
        id: test
        run: |
          if npm test | tee test-output.txt; then
            echo "| Tests | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Tests | Failed |" >> $GITHUB_STEP_SUMMARY
            exit 1

      - name: Add Test Detail
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Vitest Detail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
