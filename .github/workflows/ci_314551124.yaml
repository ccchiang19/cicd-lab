name: CI-314551124

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # # 初始化 Summary
      # - name: Initialize Summary
      #   run: |
      #     echo "# CI Pipeline Result" >> $GITHUB_STEP_SUMMARY
      #     echo "" >> $GITHUB_STEP_SUMMARY
      #     echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
      #     echo "|---|---|" >> $GITHUB_STEP_SUMMARY

      # =========================
      # TypeScript
      # =========================
      - name: TypeScript Typecheck
        run: |
          npm run typecheck 2>&1 | tee type.txt
          echo "TYPE_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Prettier Check
        run: |
          npm run format:check 2>&1 | tee prettier.txt
          echo "PRETTIER_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Run Tests
        run: |
          npm test -- --no-color 2>&1 | tee test.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Generate Summary
        if: always()
        run: |

          [ "$TYPE_EXIT" = "0" ] && TYPE_STATUS="Passed" || TYPE_STATUS="Failed"
          [ "$PRETTIER_EXIT" = "0" ] && PRETTIER_STATUS="Passed" || PRETTIER_STATUS="Failed"
          [ "$TEST_EXIT" = "0" ] && TEST_STATUS="Passed" || TEST_STATUS="Failed"

          echo "# CI Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Typecheck | $TYPE_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Prettier | $PRETTIER_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | $TEST_STATUS |" >> $GITHUB_STEP_SUMMARY

          if [ "$TYPE_EXIT" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## TypeScript Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -r "s/\x1B\[[0-9;]*[mK]//g" type.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PRETTIER_EXIT" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Prettier Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -r "s/\x1B\[[0-9;]*[mK]//g" prettier.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$TEST_EXIT" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Test Failed Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -r "s/\x1B\[[0-9;]*[mK]//g" test.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$TYPE_EXIT" != "0" ] || [ "$PRETTIER_EXIT" != "0" ] || [ "$TEST_EXIT" != "0" ]; then
            exit 1
          fi
