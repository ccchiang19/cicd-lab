name: CI-314551124

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Summary
        run: |
          echo "# CI Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY

      - name: TypeScript Typecheck
        run: |
          npm run typecheck
          echo "| TypeScript Typecheck | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

      - name: Prettier Check
        run: |
          npm run format:check
          echo "| Prettier Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

      - name: Run Tests
        run: |
          npm test | tee test-output.txt
          echo "| Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

      - name: Add Test Detail
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Vitest Detail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
